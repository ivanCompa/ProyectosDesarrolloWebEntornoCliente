<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Battle</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <nav>
      <a href="index.html"
        ><button><b>Battle</b></button></a
      >
      <a href="team.html"><button>Team</button></a>
      <a href="historic.html"><button>Historic</button></a>
    </nav>

    <div id="battle">
      <h2>Battle</h2>

      <div id="pokemon-wrap" style="text-align: center">
        <img id="pokemon-img" src="" alt="pokemon" />
        <p id="pokemon-name"></p>

        <div class="progress-bar">
          <div id="pokemon-hp" class="progress-fill"></div>
        </div>

        <p id="pokemon-atk"></p>

        <p style="margin-top: 20px; font-weight: bold">Trainer HP</p>

        <div class="progress-bar">
          <div id="trainer-hp" class="progress-fill"></div>
        </div>

        <button id="btn-attack" class="attack">Atacar</button>
        <button id="btn-capture" class="capture">Capturar</button>
        <button id="btn-escape" class="escape">Escapar</button>
      </div>
    </div>

    <script src="js/index.js"></script>
  </body>
</html>
