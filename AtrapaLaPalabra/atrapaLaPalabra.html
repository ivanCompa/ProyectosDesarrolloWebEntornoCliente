<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atrapa la palabra</title>
    <script defer src="./js/main.js" type="module"></script>
    <link rel="stylesheet" href="./styles/atrapaLaPalabra.css" />
  </head>
  <body>
    <main>
        <p id="contadorVidas" class="contadorVidas">Vidas: 3</p>
        <p id="contadorPuntos" class="contadorPuntos">Puntos: 0</p>
        <p id="contadorHighScore" class="contadorHighScore">
          Mejor puntuación: 0
        </p>
        <p id="contadorLastScore" class="contadorLastScore">
          Última puntuación: 0
        </p>
        <div id="spawnerPalabras" class="spawnerPalabras"></div>

      <button class="btnIniciarJuego" id="btnIniciarJuego">
        Iniciar Juego
      </button>
      <input type="text" class="escribir" id="escritor" />
    </main>
  </body>
</html>
