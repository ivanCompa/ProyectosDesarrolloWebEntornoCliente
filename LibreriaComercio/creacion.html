<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Libreria Comercio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" media="screen" href="./styles/crear.css" />
    <script defer src="./js/creacion.js" type="module"></script>
  </head>
  <body>
    <main>
      <section class="cabecera">
        <img src="logoComercio.png" class="logoComercio" />
        <p>Libreria Comercio</p>
      </section>
      <img src="libreria2.jpg" class="libreria2" />
      <p>Nombre:</p>
      <input type="text" id="inputNombre" />
      <p>Paginas:</p>
      <input type="number" id="inputPaginas" />

      <p>Prestado: <input type="checkbox" id="inputPrestado" /></p>
      <br />
      <input
        class="btnCrear"
        type="submit"
        value="Crear"
        id="inputCrearLibro"
      />
      <p id="textoCreado"></p>
    </main>
  </body>
</html>
